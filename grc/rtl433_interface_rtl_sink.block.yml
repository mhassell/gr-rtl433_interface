id: rtl433_interface_rtl_sink
label: rtl_sink
category: '[rtl433_interface]'

templates:
  imports: from gnuradio import rtl433_interface
  make: rtl433_interface.rtl_sink(${freq}, ${samp_rate}, ${format})
  callbacks:
  - set_freq(${freq})
  - set_samp_rate(${samp_rate})

parameters:
- id: freq
  label: Frequency (Hz)
  dtype: real
  default: 433.92e6
- id: samp_rate
  label: Sample Rate (Hz)
  dtype: real
  default: 250e3
- id: format
  label: Sample Format
  dtype: enum
  options: [rtl433_interface.FMT_CS16, rtl433_interface.FMT_CU8]
  option_labels: [CS16, CU8]
  default: rtl433_interface.FMT_CS16

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: complex
#  vlen: ...
#  optional: ...

outputs: []

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
